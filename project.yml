# Regenerate: cd /Users/cameronro/Development/Helm && xcodegen generate

name: Helm
options:
  bundleIdPrefix: com.cameronro
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: SXWJBD2V3V
    CODE_SIGN_STYLE: Automatic
packages:
  Core:
    path: Packages/Core
  Diagnostics:
    path: Packages/Diagnostics
  DesignSystem:
    path: Packages/DesignSystem
  Persistence:
    path: Packages/Persistence
  HealthKitIngest:
    path: Packages/HealthKitIngest
  Domain:
    path: Packages/Domain
  CoachLLM:
    path: Packages/CoachLLM
targets:
  Helm:
    type: application
    platform: iOS
    sources:
      - path: Helm
      - path: HelmIntents
      - path: Shared/WatchSync
        name: WatchSync
      - path: Shared/WorkoutLiveActivity
        name: WorkoutLiveActivity
    preBuildScripts:
      - name: Bundle Debug Secrets
        script: |
          if [ "$CONFIGURATION" != "Debug" ]; then exit 0; fi
          SECRETS_SRC="${SRCROOT}/Secrets"
          SECRETS_DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Secrets"
          if [ -d "$SECRETS_SRC" ]; then
            mkdir -p "$SECRETS_DST"
            ditto "$SECRETS_SRC" "$SECRETS_DST"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronro.helm
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Helm
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: Helm reads your Apple Health data to compute readiness, training, and nutrition guidance.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Helm writes workouts and meals you log back to Apple Health.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: Helm/Helm.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    dependencies:
      - package: Core
      - package: Diagnostics
      - package: DesignSystem
      - package: Persistence
      - package: HealthKitIngest
      - package: CoachLLM
      - package: Domain
        product: ReadinessKit
      - sdk: WatchConnectivity.framework
      - target: HelmWatch
        embed: true
      - target: HelmWidgets
        embed: true
  HelmWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HelmWidgets
        excludes:
          - ExtensionInfo.plist
      - path: Shared/WorkoutLiveActivity
        name: WorkoutLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronro.helm.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HelmWidgets/ExtensionInfo.plist
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  HelmWatch:
    type: application
    platform: watchOS
    sources:
      - path: HelmWatch
      - path: Shared/WatchSync
        name: WatchSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronro.helm.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Helm
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.cameronro.helm
        INFOPLIST_KEY_NSHealthShareUsageDescription: Helm reads heart rate during workouts to show live zones on your Watch.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Helm saves workouts you start on your Watch to Apple Health.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    entitlements:
      path: HelmWatch/HelmWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - package: Core
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - target: HelmWatchWidgets
        embed: true
  HelmWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: HelmWatchWidgets
        excludes:
          - ExtensionInfo.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronro.helm.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HelmWatchWidgets/ExtensionInfo.plist
        SKIP_INSTALL: YES
    dependencies:
      - package: Core
schemes:
  Helm:
    build:
      targets:
        Helm: all
        HelmWatch: all
    run:
      config: Debug
