# Regenerate: cd /Users/cameronro/Development/Helm && xcodegen generate

name: Helm
options:
  bundleIdPrefix: com.cameronro
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: SXWJBD2V3V
    CODE_SIGN_STYLE: Automatic
packages:
  Core:
    path: Packages/Core
  Diagnostics:
    path: Packages/Diagnostics
  DesignSystem:
    path: Packages/DesignSystem
  Persistence:
    path: Packages/Persistence
  HealthKitIngest:
    path: Packages/HealthKitIngest
  Domain:
    path: Packages/Domain
  CoachLLM:
    path: Packages/CoachLLM
  ExportKit:
    path: Packages/ExportKit
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    from: 5.0.1
targets:
  Helm:
    type: application
    platform: iOS
    sources:
      - path: Helm
        excludes:
          - Resources
      - path: Helm/Resources/ExerciseSeed
        type: folder
        buildPhase: resources
      - path: Helm/Resources/ExerciseSeed/exercises.json
        buildPhase: resources
      - path: Helm/Resources/ExerciseSeed/free-exercise-db.json
        buildPhase: resources
      - path: Helm/Resources/MethodologySeed
        type: folder
        buildPhase: resources
      - path: Helm/Resources/Sounds
        type: folder
        buildPhase: resources
      - path: Helm/Resources/boxing-bell.caf
        buildPhase: resources
      - path: Helm/Resources/boxing-bell-notification.caf
        buildPhase: resources
      - path: HelmIntents
      - path: Shared/WatchSync
        name: WatchSync
      - path: Shared/WorkoutLiveActivity
        name: WorkoutLiveActivity
    preBuildScripts:
      - name: Sync Xcode Project
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then exit 0; fi
          cd "$SRCROOT"
          if [ ! -f Helm.xcodeproj/project.pbxproj ] || [ project.yml -nt Helm.xcodeproj/project.pbxproj ]; then
            xcodegen generate
          fi
        basedOnDependencyAnalysis: false
      - name: Verify bundled seed resources
        script: |
          set -e
          cd "$SRCROOT"
          for path in \
            Helm/Resources/ExerciseSeed/exercises.json \
            Helm/Resources/ExerciseSeed/free-exercise-db.json \
            Helm/Resources/MethodologySeed/methodology.json
          do
            if [ ! -f "$path" ]; then
              echo "error: Missing required resource: $path"
              exit 1
            fi
          done
        basedOnDependencyAnalysis: false
      - name: Bundle Secrets
        script: |
          SECRETS_SRC="${SRCROOT}/Secrets"
          SECRETS_DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Secrets"
          if [ -d "$SECRETS_SRC" ]; then
            mkdir -p "$SECRETS_DST"
            ditto "$SECRETS_SRC" "$SECRETS_DST"
          fi
        basedOnDependencyAnalysis: false
      - name: Copy Exercise Seed
        script: |
          set -e
          SEED_SRC="${SRCROOT}/Helm/Resources/ExerciseSeed"
          RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$RES/ExerciseSeed"
          ditto "$SEED_SRC" "$RES/ExerciseSeed"
          cp -f "$SEED_SRC/exercises.json" "$RES/exercises.json"
          cp -f "$SEED_SRC/free-exercise-db.json" "$RES/free-exercise-db.json"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronro.helm
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Signal
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: Signal reads your Apple Health data to compute readiness, training, and nutrition guidance.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Signal writes workouts and meals you log back to Apple Health.
        INFOPLIST_KEY_NSCameraUsageDescription: Signal uses the camera to estimate meal macros from photos.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Signal uses the microphone so you can dictate meals to the coach in chat.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Signal uses speech recognition to turn dictated meals into food logs via the coach.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Signal uses your photo library to estimate meal macros from meal photos.
        INFOPLIST_KEY_NSCalendarsUsageDescription: Signal reads your calendar to flag busy days on your training schedule. Events are never written back.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    # CFBundleURLTypes and LSApplicationQueriesSchemes cannot be expressed as
    # INFOPLIST_KEY_* build settings, so they need a real Info.plist.
    info:
      path: Helm/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.cameronro.helm
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - helm
        LSApplicationQueriesSchemes:
          - spotify
        # Rest bell: keeps the process alive off-screen so the timer rings on time
        # and through the Silent switch (see RestTimerBackgroundAudio).
        UIBackgroundModes:
          - audio
        NSUbiquitousContainers:
          iCloud.com.cameronro.helm:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Signal
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Helm/Helm.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.com.cameronro.helm
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.cameronro.helm
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.cameronro.helm
        com.apple.developer.icloud-services:
          - CloudDocuments
    dependencies:
      - package: Core
      - package: Diagnostics
      - package: DesignSystem
      - package: Persistence
      - package: HealthKitIngest
      - package: CoachLLM
      - package: ExportKit
      - package: Domain
        product: ReadinessKit
      - package: Domain
        product: NutritionKit
      - package: SpotifyiOS
        product: SpotifyiOS
      - sdk: WatchConnectivity.framework
      - target: HelmWatch
        embed: true
      - target: HelmWidgets
        embed: true
      - target: HelmShare
        embed: true
  HelmUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HelmUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronro.helm.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Helm
    dependencies:
      - target: Helm
  HelmShare:
    type: app-extension
    platform: iOS
    sources:
      - path: HelmShare
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronro.helm.share
        INFOPLIST_FILE: HelmShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: HelmShare/HelmShare.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    dependencies:
      - package: ExportKit
  HelmWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HelmWidgets
        excludes:
          - ExtensionInfo.plist
      - path: Shared/WorkoutLiveActivity
        name: WorkoutLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronro.helm.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HelmWidgets/ExtensionInfo.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    dependencies:
      - package: Core
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
      - sdk: ActivityKit.framework
  HelmWatch:
    type: application
    platform: watchOS
    sources:
      - path: HelmWatch
      - path: Shared/WatchSync
        name: WatchSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronro.helm.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Signal
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.cameronro.helm
        INFOPLIST_KEY_NSHealthShareUsageDescription: Signal reads heart rate during workouts to show live zones on your Watch.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Signal saves workouts you start on your Watch to Apple Health.
        INFOPLIST_KEY_WKBackgroundModes: [workout-processing]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    entitlements:
      path: HelmWatch/HelmWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.cameronro.helm.watch
    dependencies:
      - package: Core
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: WidgetKit.framework
      - target: HelmWatchWidgets
        embed: true
  HelmWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: HelmWatchWidgets
        excludes:
          - ExtensionInfo.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronro.helm.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HelmWatchWidgets/ExtensionInfo.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    entitlements:
      path: HelmWatchWidgets/HelmWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cameronro.helm.watch
    dependencies:
      - package: Core
      - sdk: WatchConnectivity.framework
schemes:
  Helm:
    build:
      targets:
        Helm: all
        HelmShare: all
        HelmWatch: all
        HelmUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HelmUITests
